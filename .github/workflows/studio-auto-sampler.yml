name: Studio Auto Sampler source checks

on:
  push:
    branches:
      - feature/studio-auto-sampler-au-m1
  pull_request:
    paths:
      - "DAWCore/Sources/DAWCore/Audio/StudioAutoSamplerCapture.swift"
      - "DAWCore/Sources/DAWCore/Audio/StudioAutoSamplerExpression.swift"
      - "DAWCore/Sources/DAWCore/Audio/StudioAutoSamplerArticulations.swift"
      - "Tests/DAWCoreTests/StudioAutoSamplerArticulationsTests.swift"
      - "Tests/DAWCoreTests/StudioAutoSamplerExpressionTests.swift"
      - "DAWCore/Sources/DAWCore/Audio/StudioAutoSamplerLooping.swift"
      - "DAWCore/Sources/DAWCore/Audio/StudioAutoSamplerReleaseCapture.swift"
      - "Tests/DAWCoreTests/StudioAutoSamplerReleaseCaptureTests.swift"
      - "Tests/DAWCoreTests/StudioAutoSamplerLoopingTests.swift"
      - "DAWUI/Sources/DAWUI/Views/StudioAutoSamplerView.swift"
      - "DAWUI/Sources/DAWUI/Views/StudioSamplerMapView.swift"
      - "Tests/DAWCoreTests/StudioAutoSamplerCaptureTests.swift"
      - ".github/workflows/studio-auto-sampler.yml"

permissions:
  contents: read

concurrency:
  group: studio-auto-sampler-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  swift-parse:
    name: Swift syntax and file integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Parse changed Swift files
        run: |
          swiftc -frontend -parse \
            DAWCore/Sources/DAWCore/Audio/StudioAutoSamplerCapture.swift \
            DAWCore/Sources/DAWCore/Audio/StudioAutoSamplerExpression.swift \
            DAWCore/Sources/DAWCore/Audio/StudioAutoSamplerArticulations.swift \
            Tests/DAWCoreTests/StudioAutoSamplerArticulationsTests.swift \
            Tests/DAWCoreTests/StudioAutoSamplerExpressionTests.swift \
            DAWCore/Sources/DAWCore/Audio/StudioAutoSamplerLooping.swift \
            DAWCore/Sources/DAWCore/Audio/StudioAutoSamplerReleaseCapture.swift \
            Tests/DAWCoreTests/StudioAutoSamplerReleaseCaptureTests.swift \
            Tests/DAWCoreTests/StudioAutoSamplerLoopingTests.swift \
            DAWUI/Sources/DAWUI/Views/StudioAutoSamplerView.swift \
            DAWUI/Sources/DAWUI/Views/StudioSamplerMapView.swift \
            Tests/DAWCoreTests/StudioAutoSamplerCaptureTests.swift
      - name: Check formatting and patch cleanliness
        run: git diff --check HEAD^ HEAD
