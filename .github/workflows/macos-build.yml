name: macOS build and tests

on:
  push:
    branches:
      - feature/stage-acoustics-sync
  pull_request:
    branches:
      - garritan-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build app and test DAWCore
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Show macOS and Swift versions
        run: |
          sw_vers
          swift --version

      - name: Resolve package dependencies
        run: swift package resolve

      # Fail quickly on mic-bus graph regressions before the full app build.
      # The same compiled test products are reused by the full suite below.
      - name: Verify V-Rack microphone graph
        run: swift test --filter VRackMicrophoneRoutingTests

      - name: Build all targets
        run: swift build

      - name: Run regression tests
        run: swift test --parallel

      # The release configuration enables optimization and C++ RELEASE flags;
      # a successful debug build does not verify this production build path.
      - name: Build optimized application
        run: swift build -c release --product DAWApp

      # Offline only. The three contrasting synthetic room definitions
      # and a separate default-room holdout never change the running DAW.
      - name: Measure contrasting custom rooms in six octave bands
        run: |
          swift run -c release RoomAcousticCalibration --seconds 12 --suite > native-room-calibration.json
          python3 - <<'PY'
          import json, os
          report = json.load(open("native-room-calibration.json"))
          assert report["scenarioSuiteEnabled"] is True
          assert report["profileCount"] == 9, "Expected eight unchanged profiles plus one offline experiment"
          scenarios = {r["scenarioID"]: r for r in report["rooms"]}
          expected = {"small-treated", "medium-wood", "large-reflective",
                      "default-holdout", "small-treated-experimental-fit"}
          assert expected.issubset(scenarios)
          # Explicit regression guard: a failed experimental algorithm must
          # never modify the normal native room chosen in Studio.
          normal = scenarios["small-treated"]
          candidate = scenarios["small-treated-experimental-fit"]
          # Swift's JSONEncoder omits nil Optional fields rather than
          # emitting explicit nulls. Missing means "not applicable".
          assert all(b.get("uncalibratedT20Seconds") is None for b in normal["bands"])
          assert any(b.get("uncalibratedT20Seconds") is not None
                     for b in candidate["bands"])
          summary = ["## Six-band acoustic calibration suite", "",
                     "Synthetic Studio DSP only; same rendered impulse, old versus new octave filters.",
                     "", "| Scenario | Valid T20 bands | Current error | Before short-room fit | Legacy analysis | Worst current error |",
                     "|---|---:|---:|---:|---:|---:|"]
          for room in report["rooms"]:
              assert len(room["bands"]) == 6, f"Missing octave bands for {room['scenarioID']}"
              observed = room["validT20Bands"]
              mae = room["meanAbsoluteT20ErrorPercent"]
              worst = room["maximumAbsoluteT20ErrorPercent"]
              previous = room["legacyMeanAbsoluteT20ErrorPercent"]
              untuned = room.get("uncalibratedMeanAbsoluteT20ErrorPercent")
              assert 0 <= observed <= 6
              if observed:
                  assert mae is not None and worst is not None
              fmt = lambda x: "n/a" if x is None else f"{x:.1f}%"
              summary.append(f"| {room['scenarioID']} | {observed}/6 | {fmt(mae)} | {fmt(untuned)} | {fmt(previous)} | {fmt(worst)} |")
              print(f"\\n{room['scenarioID']} — {room['targetProvenance']}")
              for band in room["bands"]:
                  measured = band.get("measuredT20Seconds")
                  error = band.get("t20ErrorPercent")
                  result = "n/a (insufficient range)" if measured is None else f"{measured:.2f}s ({error:+.1f}%)"
                  old = band.get("legacyWideBandT20Seconds")
                  old_result = "n/a" if old is None else f"{old:.2f}s"
                  untreated = band.get("uncalibratedT20Seconds")
                  untuned_result = "" if untreated is None else f" | untuned DSP {untreated:.2f}s"
                  print(f"  {band['centerHz']:>5.0f} Hz | target {band['intendedRT60Seconds']:.2f}s | T20 new {result} | old analysis {old_result}{untuned_result}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("\n".join(summary) + "\n")
          PY

      - name: Archive room calibration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-room-calibration
          path: native-room-calibration.json
          if-no-files-found: ignore
