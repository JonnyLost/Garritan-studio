name: macOS build and tests

on:
  push:
    branches:
      - feature/stage-acoustics-sync
  pull_request:
    branches:
      - garritan-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build app and test DAWCore
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Show macOS and Swift versions
        run: |
          sw_vers
          swift --version

      - name: Resolve package dependencies
        run: swift package resolve

      - name: Build all targets
        run: swift build

      - name: Run regression tests
        run: swift test --parallel

      # The release configuration enables optimization and C++ RELEASE flags;
      # a successful debug build does not verify this production build path.
      - name: Build optimized application
        run: swift build -c release --product DAWApp

      # Offline impulse-analysis only. No external room audio is bundled.
      - name: Measure five native rooms in six octave bands
        run: |
          swift run -c release RoomAcousticCalibration --seconds 6 > native-room-calibration.json
          python3 - <<'PY'
          import json
          report = json.load(open("native-room-calibration.json"))
          assert report["profileCount"] == 5, "Expected four factory rooms and one custom design"
          for room in report["rooms"]:
              assert len(room["bands"]) == 6, f"Missing octave bands for {room['roomID']}"
              print(f"\\n{room['roomName']} — {room['targetProvenance']}")
              for band in room["bands"]:
                  measured = band.get("measuredT20Seconds")
                  error = band.get("t20ErrorPercent")
                  result = "n/a (insufficient range)" if measured is None else f"{measured:.2f}s ({error:+.1f}%)"
                  print(f"  {band['centerHz']:>5.0f} Hz | target {band['intendedRT60Seconds']:.2f}s | T20 {result}")
          PY

      - name: Archive room calibration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-room-calibration
          path: native-room-calibration.json
          if-no-files-found: ignore
