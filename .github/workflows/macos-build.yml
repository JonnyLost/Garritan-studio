name: macOS build and tests

on:
  push:
    branches:
      - feature/stage-acoustics-sync
      - integration/studio-complete-mac-test
      - architecture/studio-independence
  pull_request:
    branches:
      - garritan-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build app and test DAWCore
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Show macOS and Swift versions
        run: |
          sw_vers
          swift --version

      - name: Enforce Studio architecture compatibility contracts
        run: python3 Tools/check_studio_independence.py

      - name: Verify local-first package has no third-party dependencies
        run: |
          swift package dump-package > /tmp/studio-manifest.json
          python3 - <<'PY'
          import json
          with open('/tmp/studio-manifest.json') as f:
              manifest = json.load(f)
          assert manifest['name'] == 'Studio', manifest['name']
          assert not manifest['dependencies'], manifest['dependencies']
          print('Local-first Studio has no external SwiftPM dependencies')
          PY

      - name: Resolve package dependencies
        run: swift package resolve

      - name: Build all targets
        run: swift build

      - name: Run regression tests
        run: swift test --parallel

      # The release configuration enables optimization and C++ RELEASE flags;
      # a successful debug build does not verify this production build path.
      - name: Build optimized application
        run: swift build -c release --product DAWApp

      # Offline impulse-analysis only. Does not route audio through Studio.
      - name: Measure four native room responses
        run: swift run -c release RoomAcousticCalibration --seconds 5 > native-room-calibration.json

      - name: Archive room calibration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-room-calibration
          path: native-room-calibration.json
          if-no-files-found: ignore

  cloud-compatibility:
    name: Opt-in Supabase auth compatibility build
    runs-on: macos-15
    timeout-minutes: 35
    env:
      STUDIO_ENABLE_CLOUD_AUTH: "1"
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Verify opt-in manifest contract
        run: python3 Tools/check_studio_independence.py
      - name: Resolve cloud SDK only for opt-in variant
        run: swift package resolve
      - name: Compile cloud auth and complete app
        run: swift build --product DAWApp
