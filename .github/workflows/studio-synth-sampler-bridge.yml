name: Studio Synth + Sampler Integration

on:
  push:
    branches:
      - integration/studio-synth-sampler-bridge
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-synth-sampler-bridge
  cancel-in-progress: true

jobs:
  native-dsp:
    name: Native Synth and Sampler DSP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse integration Swift syntax
        run: |
          swiftc -frontend -parse \
            DAWCore/Sources/DAWCore/Audio/StudioSynthSamplerCapture.swift \
            DAWCore/Sources/DAWCore/Audio/StudioGranularSamplerBridge.swift \
            DAWCore/Sources/DAWCore/Audio/StudioSamplerInstrument.swift \
            DAWCore/Sources/DAWCore/Audio/StudioSamplerInstrumentFactory.swift \
            DAWCore/Sources/DAWCore/Audio/StudioSamplerInstrumentPackage.swift \
            DAWCore/Sources/DAWCore/Audio/StudioSamplerPatch.swift \
            DAWCore/Sources/DAWCore/Audio/StudioSynthInstrument.swift \
            DAWCore/Sources/DAWCore/Audio/PlaybackEngine.swift \
            DAWUI/Sources/DAWUI/Views/StudioSynthPanelView.swift \
            DAWUI/Sources/DAWUI/Views/StudioGranularEditorView.swift \
            DAWUI/Sources/DAWUI/Views/MainWindowView.swift \
            DAWUI/Sources/DAWUI/ViewModels/ProjectViewModel.swift
      - name: Sanitize standalone Studio Sampler DSP
        run: |
          clang++ -std=c++17 -O1 -g -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I StudioSamplerDSP/include StudioSamplerDSP/src/StudioSamplerDSP.cpp \
            Tests/StudioSamplerDSPStandalone/main.cpp -o /tmp/studio-sampler-test
          ASAN_OPTIONS=detect_leaks=1 /tmp/studio-sampler-test
      - name: Sanitize Granular synthesis DSP
        run: |
          clang++ -std=c++17 -O1 -g -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I StudioGranularDSP/include StudioGranularDSP/src/StudioGranularDSP.cpp \
            Tests/StudioGranularDSPStandalone/main.cpp -o /tmp/studio-granular-test
          ASAN_OPTIONS=detect_leaks=1 /tmp/studio-granular-test
  macos-integration:
    name: macOS integrated build and tests
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Resolve package dependencies
        run: swift package resolve
      - name: Compile complete Studio
        run: swift build
      - name: Run native Synth, Sampler and DAW tests
        run: swift test --parallel
      - name: Build optimized Studio application
        run: swift build -c release --product DAWApp
