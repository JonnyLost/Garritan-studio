name: Studio Room and Microphone Combined Gate

on:
  push:
    branches:
      - integration/studio-mic-merge-candidate-2026-11-14
  workflow_dispatch:

jobs:
  verify:
    name: Reconcile exactly one UI file, then build and test on macOS
    runs-on: macos-15
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rehearse and verify guarded Rooms/Ostinato merge
        run: bash Tools/merge-studio-rooms-ostinato-safe.sh
      - name: Resolve, build and test ALL Studio targets
        run: |
          swift package resolve
          swift build
          swift test --parallel
      - name: Build optimized Studio application
        run: swift build -c release --product DAWApp
  publish:
    name: Publish to disposable candidate only after green macOS verification
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repeat exact pinned and conflict-guarded merge
        run: bash Tools/merge-studio-rooms-ostinato-safe.sh
      - name: Fast-forward candidate, never modify shared integration or feature refs
        run: |
          set -euo pipefail
          if [[ "${STUDIO_MIC_ALREADY_MERGED:-}" == "true" ]]; then
            echo "Already integrated in candidate."
            exit 0
          fi
          # GitHub Apps without workflows permission cannot push changes
          # to .github/workflows. The verified *application source* may be
          # published as a single-parent commit while leaving existing CI
          # workflows untouched. Original feature branches still retain them.
          git merge --quit
          while IFS= read -r changed; do
            [[ -n "$changed" ]] || continue
            if git cat-file -e "HEAD:$changed" 2>/dev/null; then
              git restore --source=HEAD --staged --worktree -- "$changed"
            else
              git rm -f --ignore-unmatch -- "$changed"
            fi
          done < <(git diff --cached --name-only -- .github/workflows/)
          if [[ -n "$(git diff --cached --name-only -- .github/workflows/)" ]]; then
            echo "Workflow changes remain; refusing unauthorized push." >&2
            exit 1
          fi
          git diff --cached --check
          grep -q 'OstinatoWorkspaceView(viewModel: viewModel)' DAWUI/Sources/DAWUI/Views/MainWindowView.swift
          grep -q 'StudioRoomAcousticsWorkspaceView(viewModel: viewModel)' DAWUI/Sources/DAWUI/Views/MainWindowView.swift
          grep -q 'ensureMicrophoneMasterReturnConnected(format: format)' DAWCore/Sources/DAWCore/Audio/AudioEngine.swift
          git commit -m "Integrate verified Rooms and virtual microphone routing with Ostinato"
          git push origin HEAD:refs/heads/integration/studio-mic-merge-candidate-2026-11-14
