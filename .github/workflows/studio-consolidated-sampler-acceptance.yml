name: Studio consolidated Sampler acceptance

on:
  push:
    branches:
      - integration/studio-sampler-portable-packages-2026-11-14
      - integration/studio-alpha1-consolidated-2026-11-14
  pull_request:
    branches:
      - integration/studio-safe-consolidation-2026-11-14
      - integration/studio-alpha1-consolidated-2026-11-14
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-sampler-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-integration:
    name: macOS integrated build, regression and release
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
      - name: Report toolchain and candidate SHA
        run: |
          sw_vers
          swift --version
          git rev-parse HEAD
      - name: Resolve dependencies
        run: swift package resolve
      - name: Build complete Studio package
        run: swift build
      - name: Run complete Swift regression suite
        run: swift test --parallel
      - name: Build optimized DAW application
        run: swift build -c release --product DAWApp
      - name: Validate Sampler and integration surfaces remain present
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            DAWCore/Sources/DAWCore/Audio/StudioSamplerInstrumentPackage.swift \
            DAWCore/Sources/DAWCore/Audio/StudioSamplerInstrumentFactory.swift \
            DAWCore/Sources/DAWCore/Audio/StudioSamplerFactoryRecovery.swift \
            DAWCore/Sources/DAWCore/Audio/StudioSamplerFactoryProcessor.swift \
            DAWCore/Sources/DAWCore/Audio/StudioSamplerFactoryStarterLibrary.swift \
            DAWUI/Sources/DAWUI/Views/StudioSamplerFactoryView.swift \
            DAWUI/Sources/DAWUI/Views/StudioSamplerLibraryBrowser.swift \
            Tests/DAWCoreTests/StudioSamplerInstrumentPackageTests.swift \
            Tests/DAWCoreTests/StudioSamplerInstrumentFactoryTests.swift; do
            test -f "$path" || { echo "Required integration surface missing: $path"; exit 1; }
          done

  sampler-native-dsp:
    name: Sampler C++ sanitizers and disk-stream stress
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
      - name: Compile and run native Sampler DSP tests with ASan and UBSan
        run: |
          set -euo pipefail
          clang++ -std=c++17 -O1 -g -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I StudioSamplerDSP/include -I StudioSharedPCM/include \
            StudioSharedPCM/src/StudioSharedPCM.cpp \
            StudioSamplerDSP/src/StudioSamplerDSP.cpp \
            Tests/StudioSamplerDSPStandalone/main.cpp \
            -o /tmp/studio-sampler-integrated-dsp
          ASAN_OPTIONS=detect_leaks=1 /tmp/studio-sampler-integrated-dsp
      - name: Stress 72 streamed zones and delayed disk reads
        run: |
          set -euo pipefail
          clang++ -std=c++17 -O1 -g -pthread -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I StudioSamplerDSP/include -I StudioSharedPCM/include \
            StudioSharedPCM/src/StudioSharedPCM.cpp \
            StudioSamplerDSP/src/StudioSamplerDSP.cpp \
            Tests/StudioSamplerDSPStandalone/stream_stress.cpp \
            -o /tmp/studio-sampler-integrated-stress
          ASAN_OPTIONS=detect_leaks=1 /tmp/studio-sampler-integrated-stress

  branch-reconciliation-audit:
    name: Read-only true Git merge rehearsals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit all independent product branches without publishing merges
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git config user.name 'Studio CI Conflict Audit'
          git config user.email 'studio-ci@users.noreply.github.com'
          frozen="$(git rev-parse HEAD)"
          echo '### Alpha 1 non-destructive source integration audit' >> "$GITHUB_STEP_SUMMARY"
          echo 'The `integration/studio-alpha1-consolidated-2026-11-14` candidate is not changed by these rehearsals.' >> "$GITHUB_STEP_SUMMARY"
          echo '| Source branch | Commit relation (ours/theirs) | Merge rehearsal |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          branches=(
            architecture/studio-independence
            feature/stage-acoustics-sync
            fix/studio-virtual-microphone-routing-2026-11-14
            feature/studio-core-project-integrity
            feature/studio-sampler-native
            feature/studio-core-midi-export
            integration/studio-complete-mac-test
            windows-morning-build
            windows-port-foundation
          )
          for source in "${branches[@]}"; do
            remote="refs/remotes/origin/$source"
            git show-ref --quiet --verify "$remote"
            counts="$(git rev-list --left-right --count "$frozen...$remote")"
            echo "SOURCE $source | $counts"
            git reset --hard "$frozen" >/dev/null
            if git merge --no-ff --no-commit "$remote" > /tmp/studio-alpha1-merge.log 2>&1; then
              echo "CLEAN $source"
              echo "| $source | $counts | clean |" >> "$GITHUB_STEP_SUMMARY"
            else
              conflicts="$(git diff --name-only --diff-filter=U)"
              if [ -n "$conflicts" ]; then
                echo "CONFLICT $source"
                printf '%s\n' "$conflicts"
                count="$(printf '%s\n' "$conflicts" | wc -l | tr -d ' ')"
                echo "| $source | $counts | $count conflict paths; manual reconciliation needed |" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "MERGE_ERROR $source"
                tail -40 /tmp/studio-alpha1-merge.log
                echo "| $source | $counts | merge error; inspect logs |" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
            if [ -f "$(git rev-parse --git-path MERGE_HEAD)" ]; then
              git merge --abort || true
            fi
            git reset --hard "$frozen" >/dev/null
          done
          test "$(git rev-parse HEAD)" = "$frozen"
          echo 'NO remote refs were modified. Conflicts are **not** authorization to discard either side.' >> "$GITHUB_STEP_SUMMARY"
